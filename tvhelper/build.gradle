plugins {
    id 'com.android.application'
}

// Small companion app installed on the TV by the phone app. It draws the mouse cursor
// as an overlay window; clicks are injected by the phone app over ADB.
android {
    namespace 'com.example.tvtrackpad.tvhelper'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.tvtrackpad.tvhelper'
        minSdk 24
        targetSdk 28            // keeps the overlay service simple to start from ADB
        versionCode 3
        versionName '1.2'
    }

    signingConfigs {
        debug {
            storeFile file('../app/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
