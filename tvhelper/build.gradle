plugins {
    id 'com.android.application'
}

// Small companion app installed on the TV by the phone app. It draws the mouse cursor
// and performs clicks/scrolls via an accessibility service.
android {
    namespace 'com.example.tvtrackpad.tvhelper'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.tvtrackpad.tvhelper'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        debug {
            storeFile file('../app/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
