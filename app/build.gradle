plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.tvtrackpad'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.tvtrackpad'
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Fixed signing key kept in the repo, so each new build installs over the previous one
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
