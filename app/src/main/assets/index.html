<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e1013">
<title>TV Trackpad</title>
<style>
  :root{
    --bg:#000; --panel:#121418; --panel2:#23272e; --line:#363c45;
    --text:#e8eaed; --dim:#b4bac3; --accent:#4f9cff; --ok:#3ecf8e; --warn:#f5a524;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;
    user-select:none;-webkit-user-select:none}
  body{display:flex;flex-direction:column;height:100dvh;
    padding:env(safe-area-inset-top) 10px calc(env(safe-area-inset-bottom) + 10px)}
  button{font:inherit;color:inherit;border:0;background:var(--panel2);border-radius:12px;cursor:pointer}
  button:active{background:#3a414b}
  svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  header{display:flex;align-items:center;gap:8px;padding:10px 2px}
  .status{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--warn);flex:none}
  .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  #statusText{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim)}
  header button{padding:9px 14px}
  #connectBtn{background:var(--accent);color:#fff;font-weight:600}
  .icon-btn{padding:9px 10px;display:grid;place-items:center}

  #pad{flex:1;min-height:160px;position:relative;border-radius:18px;
    background:radial-gradient(circle at 50% 40%,#262b33,#1b1f25);
    border:1px solid var(--line);touch-action:none;overflow:hidden}
  #pad::before{content:"";position:absolute;inset:0;opacity:.35;
    background-image:radial-gradient(#4a525e 1px,transparent 1px);background-size:22px 22px}
  #hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:var(--dim);
    font-size:12px;pointer-events:none;padding:0 14px;transition:opacity .4s}
  #touchDot{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;
    background:rgba(79,156,255,.18);border:1px solid rgba(79,156,255,.5);pointer-events:none;
    opacity:0;transition:opacity .15s}
  #pad.drag #touchDot{background:rgba(62,207,142,.25);border-color:var(--ok)}

  .clicks{display:flex;gap:8px;margin-top:8px}
  .clicks button{flex:1;height:44px;color:var(--dim);font-size:13px}

  .row{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:8px}
  .row button{height:52px;display:grid;place-items:center}
  .row button.active{background:var(--accent);color:#fff}

  #kbd{display:none;margin-top:8px;background:var(--panel);border:1px solid var(--line);
    border-radius:16px;padding:10px}
  #kbd.show{display:block}
  .kline{display:flex;gap:8px}
  #typeBox{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:11px 12px;font:inherit;outline:none;user-select:text;-webkit-user-select:text}
  #typeBox:focus{border-color:var(--accent)}
  .kline button{padding:0 14px;height:44px}
  .dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,46px);
    gap:6px;justify-content:center;margin-top:10px}
  .dpad button{display:grid;place-items:center}
  .dpad .ok{background:var(--accent);color:#fff;font-weight:600}
  .extra{display:flex;gap:6px;justify-content:center;margin-top:8px}
  .extra button{padding:9px 12px;font-size:13px;color:var(--dim)}

  #sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:5}
  #sheet.show{display:flex}
  .sheet-in{width:100%;background:var(--panel);border-radius:20px 20px 0 0;
    padding:18px 18px calc(env(safe-area-inset-bottom) + 18px)}
  .sheet-in h2{margin:0 0 14px;font-size:17px}
  .set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;
    border-bottom:1px solid var(--line)}
  .set label{flex:1}
  .set small{display:block;color:var(--dim);font-size:12px}
  input[type=range]{width:46%;accent-color:var(--accent)}
  input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
  .sheet-actions{display:flex;gap:8px;margin-top:16px}
  .sheet-actions button{flex:1;height:46px}

  select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 8px;font:inherit}

  /* ---- OLED dim mode: almost every pixel off, controls as faint outlines ---- */
  body{transition:transform 1.5s}
  button,#pad,#statusText,#touchDot{transition:background .6s,color .6s,border-color .6s,box-shadow .6s}
  body.dim button{background:transparent;box-shadow:inset 0 0 0 1px #3a4049;color:#9aa1ab}
  body.dim #connectBtn{background:transparent;color:#6fb0ff;font-weight:600}
  body.dim .dpad .ok{background:transparent;color:#6fb0ff}
  body.dim #pad{background:#000;border-color:#2a2f36}
  body.dim #pad::before{opacity:.2}
  body.dim #statusText{color:#8b929c}
  body.dim .dot,body.dim .dot.on{box-shadow:none;opacity:.8}
  body.dim #touchDot{background:transparent;border-color:#4f9cff}
  body.dim .row button.active{background:transparent;color:#6fb0ff;box-shadow:inset 0 0 0 1px #4f9cff}

  #toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);
    background:#000c;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;
    transition:opacity .2s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
  #toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">Starting…</span></div>
  <button id="connectBtn">Connect</button>
  <button class="icon-btn" id="settingsBtn" aria-label="Settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<div id="pad">
  <div id="touchDot"></div>
  <div id="hint">Tap to click · Two fingers to scroll · Two-finger tap = right click · Double-tap &amp; hold to drag</div>
</div>

<div class="clicks">
  <button data-click="1">Left click</button>
  <button data-click="2">Right click</button>
</div>

<div id="kbd">
  <div class="kline">
    <input id="typeBox" type="text" placeholder="Type here – it goes straight to the TV"
           autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <button data-key="42" aria-label="Backspace">⌫</button>
    <button data-key="40" aria-label="Enter">⏎</button>
  </div>
  <div class="dpad">
    <span></span><button data-key="82" aria-label="Up"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button><span></span>
    <button data-key="80" aria-label="Left"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button data-key="40" class="ok">OK</button>
    <button data-key="79" aria-label="Right"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    <span></span><button data-key="81" aria-label="Down"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button><span></span>
  </div>
  <div class="extra">
    <button data-key="41">Esc</button>
    <button data-key="43">Tab</button>
    <button data-key="44">Space</button>
    <button data-cc="182">⏮ Prev</button>
    <button data-cc="181">Next ⏭</button>
    <button id="clearBox">Clear box</button>
  </div>
</div>

<div class="row">
  <button data-cc="548" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
  <button data-cc="547" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></button>
  <button data-cc="205" aria-label="Play/Pause"><svg viewBox="0 0 24 24"><path d="M4 5v14l8-7z" fill="currentColor"/><path d="M16 5v14M20 5v14"/></svg></button>
  <button data-cc="234" aria-label="Volume down"><svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z"/><path d="M16 12h5"/></svg></button>
  <button data-cc="233" aria-label="Volume up"><svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z"/><path d="M16 12h5M18.5 9.5v5"/></svg></button>
  <button data-cc="226" aria-label="Mute"><svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z"/><path d="M16 9l5 6M21 9l-5 6"/></svg></button>
  <button id="kbdBtn" aria-label="Keyboard"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg></button>
</div>

<div id="sheet">
  <div class="sheet-in">
    <h2>Settings</h2>
    <div class="set"><label>Pointer speed</label><input type="range" id="sens" min="0.4" max="3" step="0.1"></div>
    <div class="set"><label>Pointer acceleration</label><input type="range" id="accel" min="0" max="2" step="0.1"></div>
    <div class="set"><label>Scroll speed</label><input type="range" id="scrollSp" min="0.3" max="3" step="0.1"></div>
    <div class="set"><label>Natural scrolling<small>Content follows your fingers, like a phone</small></label><input type="checkbox" id="natural"></div>
    <div class="set"><label>Vibrate on click</label><input type="checkbox" id="haptic"></div>
    <div class="set"><label>Show over lock screen<small>Use the remote without unlocking</small></label><input type="checkbox" id="onLock"></div>
    <div class="set"><label>Dim when idle<small>Black low-power look for OLED screens</small></label>
      <select id="dimAfter"><option value="0">Never</option><option value="10">After 10 s</option><option value="30">After 30 s</option><option value="60">After 1 min</option><option value="180">After 3 min</option></select></div>
    <div class="set"><label>Dim brightness</label><input type="range" id="dimLevel" min="0.05" max="1" step="0.05"></div>
    <div class="set"><label>Controls work while dimmed<small>Off = first tap only brightens. Tap the status line to brighten.</small></label><input type="checkbox" id="dimUsable"></div>
    <div class="set"><label>Keep screen on<small>Then the phone's normal screen timeout applies</small></label>
      <select id="awakeFor"><option value="15">15 min idle</option><option value="30">30 min idle</option><option value="60">1 hour idle</option><option value="120">2 hours idle</option><option value="0">Always</option></select></div>
    <div class="sheet-actions">
      <button id="disconnectBtn">Disconnect</button>
      <button id="logBtn">Share log</button>
      <button id="closeSheet" style="background:var(--accent);color:#fff">Done</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const bridge = window.Android || null;          // native Bluetooth bridge (added by the Android wrapper)
  const PREVIEW = !bridge;

  /* ---------- settings ---------- */
  const defaults = {sens:1.3, accel:0.8, scrollSp:1, natural:true, haptic:true,
                    onLock:true, dimAfter:60, dimLevel:0.3, dimUsable:true, awakeFor:60};
  let cfg = {...defaults};
  try { Object.assign(cfg, JSON.parse(localStorage.getItem('tvpad') || '{}')); } catch(e){}
  // older builds defaulted to a near-black 3% dim level; lift saved values to the new readable minimum
  if (!(cfg.dimLevel >= 0.05)) cfg.dimLevel = defaults.dimLevel;
  const save = () => { try { localStorage.setItem('tvpad', JSON.stringify(cfg)); } catch(e){} };
  const onCfg = {};   // hooks run when a setting changes
  ['sens','accel','scrollSp','dimLevel','dimAfter','awakeFor'].forEach(k => {
    $(k).value = cfg[k];
    $(k).oninput = $(k).onchange = e => { cfg[k] = +e.target.value; save(); onCfg[k] && onCfg[k](); };
  });
  ['natural','haptic','onLock','dimUsable'].forEach(k => {
    $(k).checked = cfg[k];
    $(k).onchange = e => { cfg[k] = e.target.checked; save(); onCfg[k] && onCfg[k](); };
  });

  /* ---------- toast ---------- */
  let toastT;
  function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1400); }

  /* ---------- sending ---------- */
  function buzz(){ if (cfg.haptic && navigator.vibrate) try{ navigator.vibrate(12); }catch(e){} }
  function mouse(buttons, dx, dy, wheel=0, pan=0){
    if (bridge) bridge.mouse(buttons, dx, dy, wheel, pan);
  }
  function click(btn){ mouse(btn,0,0); mouse(0,0,0); buzz(); if (PREVIEW) toast(btn===1?'Left click':'Right click'); }
  function key(code, mod=0){ if (bridge) bridge.key(mod, code); else toast('Key 0x'+code.toString(16)+(mod?' +shift':'')); }
  function cc(usage){ if (bridge) bridge.consumer(usage); else toast('Media 0x'+usage.toString(16)); buzz(); }

  /* ---------- status from native ---------- */
  let connected = false;
  window.onHidStatus = (text, isConnected) => {
    connected = !!isConnected;
    $('statusText').textContent = text;
    $('dot').classList.toggle('on', connected);
    $('connectBtn').textContent = connected ? 'Switch' : 'Connect';
  };
  if (PREVIEW) onHidStatus('Preview mode – run inside the Android app to control the TV', false);
  else if (bridge.ready) bridge.ready();

  $('connectBtn').onclick = () => bridge ? bridge.connect() : toast('Bluetooth only works inside the Android app');
  $('logBtn').onclick = () => { if (bridge && bridge.shareLog) bridge.shareLog(); else toast('Log only works inside the Android app'); };
  $('disconnectBtn').onclick = () => { if (bridge) bridge.disconnect(); $('sheet').classList.remove('show'); };
  $('settingsBtn').onclick = () => { setDim(false); $('sheet').classList.add('show'); };
  $('closeSheet').onclick = () => $('sheet').classList.remove('show');
  $('sheet').onclick = e => { if (e.target.id === 'sheet') $('sheet').classList.remove('show'); };

  /* ---------- trackpad ---------- */
  const pad = $('pad'), dot = $('touchDot');
  const pts = new Map();
  let downAt = 0, moved = 0, maxPts = 0, dragging = false;
  let lastTap = 0, lastTapX = 0, lastTapY = 0;
  let accX = 0, accY = 0, accW = 0, accP = 0;
  const TAP_MS = 220, TAP_MOVE = 14, NOTCH = 22;

  pad.addEventListener('pointerdown', e => {
    e.preventDefault();
    pad.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    $('hint').style.opacity = 0;
    if (pts.size === 1){
      const now = performance.now();
      downAt = now; moved = 0; maxPts = 1; accX = accY = accW = accP = 0;
      if (now - lastTap < 300 && Math.hypot(e.clientX-lastTapX, e.clientY-lastTapY) < 50){
        dragging = true; pad.classList.add('drag'); mouse(1,0,0); buzz();
      }
      const r = pad.getBoundingClientRect();
      dot.style.left = (e.clientX - r.left)+'px'; dot.style.top = (e.clientY - r.top)+'px'; dot.style.opacity = 1;
    } else {
      maxPts = Math.max(maxPts, pts.size);
    }
  });

  pad.addEventListener('pointermove', e => {
    const p = pts.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);

    if (pts.size === 1){
      const r = pad.getBoundingClientRect();
      dot.style.left = (e.clientX - r.left)+'px'; dot.style.top = (e.clientY - r.top)+'px';
      const speed = Math.hypot(dx, dy);
      const f = cfg.sens * (1 + cfg.accel * Math.min(speed, 40) / 10);
      accX += dx * f; accY += dy * f;
      const ix = Math.trunc(accX), iy = Math.trunc(accY);
      if (ix || iy){ accX -= ix; accY -= iy; mouse(dragging ? 1 : 0, ix, iy); }
    } else if (pts.size === 2){
      // each finger reports separately, so halve to get the average movement
      accW += dy * 0.5 * cfg.scrollSp; accP += dx * 0.5 * cfg.scrollSp;
      const w = Math.trunc(accW / NOTCH), h = Math.trunc(accP / NOTCH);
      if (w || h){
        accW -= w * NOTCH; accP -= h * NOTCH;
        const s = cfg.natural ? 1 : -1;
        mouse(0, 0, 0, w * s, -h * s);
      }
    }
  });

  function endPointer(e){
    if (!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if (pts.size) return;
    dot.style.opacity = 0;
    const now = performance.now(), quick = now - downAt < TAP_MS;
    if (dragging){
      dragging = false; pad.classList.remove('drag');
      mouse(0,0,0);
      if (quick && moved < TAP_MOVE){ click(1); }   // double-tap without moving = double click
      lastTap = 0;
      return;
    }
    if (quick && moved < TAP_MOVE * maxPts){
      if (maxPts >= 2){ click(2); lastTap = 0; }
      else { click(1); lastTap = now; lastTapX = e.clientX; lastTapY = e.clientY; }
    }
  }
  pad.addEventListener('pointerup', endPointer);
  pad.addEventListener('pointercancel', endPointer);
  pad.addEventListener('contextmenu', e => e.preventDefault());

  document.querySelectorAll('[data-click]').forEach(b => b.onclick = () => click(+b.dataset.click));
  document.querySelectorAll('[data-cc]').forEach(b => b.onclick = () => cc(+b.dataset.cc));
  document.querySelectorAll('[data-key]').forEach(b => b.onclick = () => { key(+b.dataset.key); buzz(); });

  /* ---------- keyboard ---------- */
  // US layout HID usage codes
  const MAP = {}, SHIFT = 2;
  'abcdefghijklmnopqrstuvwxyz'.split('').forEach((c,i) => { MAP[c] = [0x04+i,0]; MAP[c.toUpperCase()] = [0x04+i,SHIFT]; });
  '1234567890'.split('').forEach((c,i) => MAP[c] = [0x1E+i,0]);
  '!@#$%^&*()'.split('').forEach((c,i) => MAP[c] = [0x1E+i,SHIFT]);
  [[' ',0x2C],['-',0x2D],['=',0x2E],['[',0x2F],[']',0x30],['\\',0x31],[';',0x33],["'",0x34],['`',0x35],[',',0x36],['.',0x37],['/',0x38],['\n',0x28],['\t',0x2B]]
    .forEach(([c,k]) => MAP[c] = [k,0]);
  [['_',0x2D],['+',0x2E],['{',0x2F],['}',0x30],['|',0x31],[':',0x33],['"',0x34],['~',0x35],['<',0x36],['>',0x37],['?',0x38]]
    .forEach(([c,k]) => MAP[c] = [k,SHIFT]);
  // smart punctuation from phone keyboards
  Object.assign(MAP, {'‘':MAP["'"], '’':MAP["'"], '“':MAP['"'], '”':MAP['"'], '–':MAP['-'], '—':MAP['-'], '…':null});

  function typeText(str){
    for (const ch of str){
      if (ch === '…'){ typeText('...'); continue; }
      const m = MAP[ch];
      if (m) key(m[0], m[1]);
    }
  }

  const box = $('typeBox');
  let prev = '';
  box.addEventListener('input', () => {
    const now = box.value;
    let i = 0; const n = Math.min(prev.length, now.length);
    while (i < n && prev[i] === now[i]) i++;
    for (let d = prev.length - i; d > 0; d--) key(0x2A);   // backspaces for removed chars
    typeText(now.slice(i));
    prev = now;
  });
  box.addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); key(0x28); }
    else if (e.key === 'Backspace' && box.value === ''){ key(0x2A); }   // keep deleting on the TV
  });
  $('clearBox').onclick = () => { box.value = ''; prev = ''; box.focus(); };

  $('kbdBtn').onclick = () => {
    const show = !$('kbd').classList.contains('show');
    $('kbd').classList.toggle('show', show);
    $('kbdBtn').classList.toggle('active', show);
    if (show){ setDim(false); box.focus(); } else box.blur();
  };

  /* ---------- lock screen, OLED dim mode, screen timeout ---------- */
  const has = fn => bridge && typeof bridge[fn] === 'function';
  let dimmed = false, awake = true, swallowClick = false, idleT, sleepT;

  function setDim(on){
    if (dimmed === on) return;
    dimmed = on;
    document.body.classList.toggle('dim', on);
    if (!on) document.body.style.transform = '';
    if (has('setDim')) bridge.setDim(on, cfg.dimLevel);
  }
  function activity(){
    clearTimeout(idleT); clearTimeout(sleepT);
    if (!awake){ awake = true; if (has('keepAwake')) bridge.keepAwake(true); }
    const busy = () => $('sheet').classList.contains('show') || $('kbd').classList.contains('show');
    if (cfg.dimAfter > 0) idleT = setTimeout(() => { if (!busy()) setDim(true); }, cfg.dimAfter * 1000);
    if (cfg.awakeFor > 0) sleepT = setTimeout(() => { awake = false; if (has('keepAwake')) bridge.keepAwake(false); }, cfg.awakeFor * 60000);
  }

  // capture phase: runs before the trackpad/buttons see the touch
  document.addEventListener('pointerdown', e => {
    if (dimmed && !cfg.dimUsable){
      e.stopPropagation(); e.preventDefault();
      setDim(false);
      swallowClick = true; setTimeout(() => swallowClick = false, 600);
    }
    activity();
  }, true);
  document.addEventListener('click', e => {
    if (swallowClick){ e.stopPropagation(); e.preventDefault(); swallowClick = false; }
  }, true);
  document.addEventListener('keydown', activity, true);
  box.addEventListener('input', activity);
  document.querySelector('.status').onclick = () => { setDim(false); activity(); };

  // OLED burn-in protection: nudge the layout a few pixels every minute while dimmed
  setInterval(() => {
    if (!dimmed) return;
    const r = () => Math.round(Math.random() * 8 - 4);
    document.body.style.transform = `translate(${r()}px,${r()}px)`;
  }, 60000);

  onCfg.onLock = () => { if (has('setShowOnLock')) bridge.setShowOnLock(cfg.onLock); };
  onCfg.dimLevel = () => { if (dimmed && has('setDim')) bridge.setDim(true, cfg.dimLevel); };
  onCfg.dimAfter = onCfg.awakeFor = activity;
  onCfg.onLock();
  activity();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) activity(); });
})();
</script>
</body>
</html>
