<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e1013">
<title>TV Trackpad</title>
<style>
  :root{
    --bg:#000; --panel:#060708; --panel2:#111316; --line:#1b1e22;
    --text:#c4c9d0; --dim:#8a919b; --accent:#24508c; --ok:#3ecf8e; --warn:#f5a524;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden;overflow-y:auto;
    user-select:none;-webkit-user-select:none}
  body{display:flex;flex-direction:column;height:100vh;height:100dvh;
    padding:env(safe-area-inset-top) 10px calc(env(safe-area-inset-bottom) + 10px)}
  button{font:inherit;color:inherit;border:0;background:var(--panel2);border-radius:12px;cursor:pointer}
  button:active{background:#262b32}
  svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  header{display:flex;align-items:center;gap:8px;padding:min(10px,1.2vh) 2px;flex:none}
  .status{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--warn);flex:none}
  .dot.on{background:#2fa874;box-shadow:0 0 6px #2fa87488}
  #statusText{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim)}
  header button{padding:min(9px,1vh) 14px}
  #connectBtn{background:var(--accent);color:#e3e9f2;font-weight:600}
  .icon-btn{padding:9px 10px;display:grid;place-items:center}


  #pad{flex:1;min-height:160px;position:relative;border-radius:18px;
    background:radial-gradient(circle at 50% 40%,#101317,#0a0c0e);
    border:1px solid var(--line);touch-action:none;overflow:hidden}
  #pad::before{content:"";position:absolute;inset:0;opacity:.35;
    background-image:radial-gradient(#2a3038 1px,transparent 1px);background-size:22px 22px}
  body:has(#kbd.show) #pad{flex:0 1 17vh;min-height:70px}
  body:has(#kbd.show) #kbd{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center}
  #hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:var(--dim);
    font-size:12px;pointer-events:none;padding:0 14px;transition:opacity .4s}
  /* scroll strip on the right edge of the trackpad: drag like a scroll bar */
  #scroll{position:absolute;top:8px;bottom:8px;right:8px;width:44px;border-radius:14px;
    background:#0b0d10;border:1px solid var(--line);touch-action:none;z-index:2;
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 0;color:var(--dim)}
  #scroll svg{width:20px;height:20px;opacity:.8;pointer-events:none}
  #scroll .grip{width:4px;flex:1;margin:6px 0;border-radius:2px;pointer-events:none;
    background:repeating-linear-gradient(#2a3038 0 6px,transparent 6px 12px)}
  #scroll.on{background:#141920;border-color:var(--accent)}
  #hint{right:56px}
  #touchDot{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;
    background:rgba(79,156,255,.18);border:1px solid rgba(79,156,255,.5);pointer-events:none;
    opacity:0;transition:opacity .15s}

  .row{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:min(8px,1vh);flex:none}
  .row button{height:min(52px,6.2vh);display:grid;place-items:center}
  .row button.active{background:var(--accent);color:#e3e9f2}
  .row.small button{height:min(40px,5vh);font-size:12px;color:var(--dim)}

  #kbd{display:none;margin-top:min(8px,1vh);background:var(--panel);border:1px solid var(--line);
    border-radius:16px;padding:min(10px,1.2vh) 10px}
  #kbd.show{display:block}
  .kline{display:flex;gap:8px}
  #typeBox{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:min(11px,1.2vh) 12px;font:inherit;outline:none;user-select:text;-webkit-user-select:text}
  #typeBox:focus{border-color:var(--accent)}
  .kline button{padding:0 14px;height:min(44px,5.5vh)}
  .dpad{display:grid;grid-template-columns:repeat(3,min(104px,12vh));grid-template-rows:repeat(3,min(84px,9.5vh));
    gap:min(8px,1vh);justify-content:center;margin-top:min(12px,1.4vh)}
  .dpad button{display:grid;place-items:center;border-radius:16px}
  .dpad svg{width:38px;height:38px;stroke-width:2.4}
  .dpad .ok{background:var(--accent);color:#e3e9f2;font-weight:700;font-size:20px}
  .extra{display:flex;gap:6px;justify-content:center;margin-top:min(48px,4.5vh);flex-wrap:wrap}
  .extra button{padding:min(9px,1vh) 12px;font-size:13px;color:var(--dim)}

  #sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:5}
  #sheet.show{display:flex}
  .sheet-in{width:100%;background:var(--panel);border-radius:20px 20px 0 0;max-height:90vh;overflow:auto;
    padding:18px 18px calc(env(safe-area-inset-bottom) + 18px)}
  .sheet-in h2{margin:0 0 14px;font-size:17px}
  .set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;
    border-bottom:1px solid var(--line)}
  .set label{flex:1}
  .set small{display:block;color:var(--dim);font-size:12px}
  input[type=range]{width:46%;accent-color:var(--accent)}
  input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
  .sheet-actions{display:flex;gap:8px;margin-top:16px}
  .sheet-actions button{flex:1;height:46px}
  select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 8px;font:inherit}

  /* ---- dim mode: darker, but every control stays readable ---- */
  body{transition:transform 1.5s}
  button,#pad,#statusText{transition:background .6s,color .6s,border-color .6s,box-shadow .6s}
  body.dim button{background:transparent;box-shadow:inset 0 0 0 1px #3a4049;color:#9aa1ab}
  body.dim #connectBtn,body.dim .dpad .ok{background:transparent;color:#6fb0ff;font-weight:600}
  body.dim #pad{background:#000;border-color:#2a2f36}
  body.dim #pad::before{opacity:.2}
  body.dim #statusText{color:#8b929c}
  body.dim .dot,body.dim .dot.on{box-shadow:none;opacity:.8}
  body.dim .row button.active{background:transparent;color:#6fb0ff;box-shadow:inset 0 0 0 1px #4f9cff}

  #toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);
    background:#000c;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;
    transition:opacity .2s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
  #toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">Starting…</span></div>
  <button id="connectBtn">Connect</button>
  <button class="icon-btn" id="settingsBtn" aria-label="Settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<div id="pad">
  <div id="scroll" aria-label="Scroll">
    <svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg><div class="grip"></div><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
  </div>
  <div id="touchDot"></div>
  <div id="hint">Tap to show the cursor · Slide to move · Tap = click · Hold = long-press · Right strip or two fingers = scroll · Two-finger tap = Back</div>
</div>

<div id="kbd">
  <div class="kline">
    <input id="typeBox" type="text" placeholder="Type here – it goes straight to the TV"
           autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <button data-kc="67" aria-label="Backspace">⌫</button>
    <button data-kc="66" aria-label="Enter">⏎</button>
  </div>
  <div class="dpad">
    <span></span><button data-kc="19" aria-label="Up"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button><span></span>
    <button data-kc="21" aria-label="Left"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button data-kc="23" class="ok">OK</button>
    <button data-kc="22" aria-label="Right"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    <span></span><button data-kc="20" aria-label="Down"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button><span></span>
  </div>
  <div class="extra">
    <button data-kc="62">Space</button>
    <button data-kc="61">Tab</button>
    <button data-kc="89">« Rew</button>
    <button data-kc="90">Fwd »</button>
    <button data-kc="88">|◂ Prev</button>
    <button data-kc="87">Next ▸|</button>
    <button id="clearBox">Clear box</button>
  </div>
</div>

<div class="row">
  <button data-kc="4" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
  <button data-kc="3" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></button>
  <button data-kc="85" aria-label="Play/Pause"><svg viewBox="0 0 24 24"><path d="M4 5v14l8-7z" fill="currentColor"/><path d="M16 5v14M20 5v14"/></svg></button>
  <button data-kc="25" aria-label="Volume down"><svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z"/><path d="M16 12h5"/></svg></button>
  <button data-kc="24" aria-label="Volume up"><svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z"/><path d="M16 12h5M18.5 9.5v5"/></svg></button>
  <button data-kc="164" aria-label="Mute"><svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z"/><path d="M16 9l5 6M21 9l-5 6"/></svg></button>
  <button id="kbdBtn" aria-label="Keyboard"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg></button>
</div>
<div class="row small" style="grid-template-columns:repeat(5,1fr)">
  <button data-kc="26">Power</button>
  <button data-kc="176">Settings</button>
  <button data-kc="84">Search</button>
  <button data-kc="284">Apps</button>
  <button data-kc="82">Menu</button>
</div>

<div id="sheet">
  <div class="sheet-in">
    <h2>Settings</h2>
    <div class="set"><label>Cursor speed</label><input type="range" id="speed" min="0.5" max="4" step="0.1"></div>
    <div class="set"><label>Scroll speed<small>For the scroll strip</small></label><input type="range" id="scrollSp" min="0.3" max="3" step="0.1"></div>
    <div class="set"><label>Vibrate on press</label><input type="checkbox" id="haptic"></div>
    <div class="set"><label>Show over lock screen<small>Use the remote without unlocking</small></label><input type="checkbox" id="onLock"></div>
    <div class="set"><label>Dim when idle<small>Darker screen to save battery</small></label>
      <select id="dimAfter"><option value="0">Never</option><option value="10">After 10 s</option><option value="30">After 30 s</option><option value="60">After 1 min</option><option value="180">After 3 min</option></select></div>
    <div class="set"><label>Dim brightness<small>Share of your normal brightness</small></label><input type="range" id="dimLevel" min="0.05" max="1" step="0.05"></div>
    <div class="set"><label>Controls work while dimmed<small>Off = first tap only brightens</small></label><input type="checkbox" id="dimUsable"></div>
    <div class="set"><label>Keep screen on<small>Then the phone's normal screen timeout applies</small></label>
      <select id="awakeFor"><option value="15">15 min idle</option><option value="30">30 min idle</option><option value="60">1 hour idle</option><option value="120">2 hours idle</option><option value="0">Always</option></select></div>
    <div class="sheet-actions">
      <button id="disconnectBtn">Disconnect</button>
      <button id="logBtn">Share log</button>
      <button id="closeSheet" style="background:var(--accent);color:#fff">Done</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const bridge = window.Android || null;
  const PREVIEW = !bridge;
  const has = fn => bridge && typeof bridge[fn] === 'function';

  /* ---------- settings ---------- */
  const defaults = {speed:1.6, scrollSp:1, haptic:true, onLock:true, dimAfter:60, dimLevel:0.3, dimUsable:true, awakeFor:60,
                    kbdOpen:true};   // layout: swipe remote + keyboard panel open
  let cfg = {...defaults};
  try { Object.assign(cfg, JSON.parse(localStorage.getItem('tvpad-wifi') || '{}')); } catch(e){}
  const save = () => { try { localStorage.setItem('tvpad-wifi', JSON.stringify(cfg)); } catch(e){} };
  const onCfg = {};
  ['speed','scrollSp','dimLevel','dimAfter','awakeFor'].forEach(k => {
    $(k).value = cfg[k];
    $(k).oninput = $(k).onchange = e => { cfg[k] = +e.target.value; save(); onCfg[k] && onCfg[k](); };
  });
  ['haptic','onLock','dimUsable'].forEach(k => {
    $(k).checked = cfg[k];
    $(k).onchange = e => { cfg[k] = e.target.checked; save(); onCfg[k] && onCfg[k](); };
  });

  /* ---------- toast ---------- */
  let toastT;
  function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1400); }

  /* ---------- sending ---------- */
  function buzz(){ if (cfg.haptic && navigator.vibrate) try{ navigator.vibrate(12); }catch(e){} }
  const KEY = {UP:19, DOWN:20, LEFT:21, RIGHT:22, OK:23, BACK:4, DEL:67, ENTER:66};
  function key(kc){ if (bridge) bridge.key(kc); else toast('Key ' + kc); }

  /* ---------- status from native ---------- */
  let connected = false;
  window.onTvStatus = (text, isConnected) => {
    connected = !!isConnected;
    $('statusText').textContent = text;
    $('dot').classList.toggle('on', connected);
    $('connectBtn').textContent = connected ? 'Switch' : 'Connect';
  };
  if (PREVIEW) onTvStatus('Preview mode – run inside the Android app to control the TV', false);
  else if (bridge.ready) bridge.ready();

  $('connectBtn').onclick = () => bridge ? bridge.connect() : toast('Only works inside the Android app');
  $('logBtn').onclick = () => { if (has('shareLog')) bridge.shareLog(); else toast('Log only works inside the Android app'); };
  $('disconnectBtn').onclick = () => { if (bridge) bridge.disconnect(); $('sheet').classList.remove('show'); };
  $('settingsBtn').onclick = () => { setDim(false); $('sheet').classList.add('show'); };
  $('closeSheet').onclick = () => $('sheet').classList.remove('show');
  $('sheet').onclick = e => { if (e.target.id === 'sheet') $('sheet').classList.remove('show'); };

  document.querySelectorAll('[data-kc]').forEach(b => b.onclick = () => { key(+b.dataset.kc); buzz(); });

  const pad = $('pad'), dot = $('touchDot');

  /* ---------- trackpad: moves a cursor on the TV ---------- */
  // First tap shows the cursor; after that: move = point, tap = click, hold = long-press,
  // two fingers = scroll, two-finger tap = Back. The cursor hides after 30 s idle (same as the TV).
  const pts = new Map();
  let downAt = 0, moved = 0, maxPts = 0, holdT = null, held = false;
  let accX = 0, accY = 0, scX = 0, scY = 0, flushReq = false;
  let cursorOn = false, cursorT = null;
  const TAP_MS = 250, TAP_MOVE = 12, HOLD_MS = 600, CURSOR_IDLE = 29000, SCROLL_STEP = 24;

  function mouse(c){ if (bridge && bridge.mouse) bridge.mouse(c); }
  function cursorAlive(){ cursorOn = true; clearTimeout(cursorT); cursorT = setTimeout(() => cursorOn = false, CURSOR_IDLE); }
  function hideCursor(){ if (cursorOn){ mouse('H'); cursorOn = false; clearTimeout(cursorT); } }

  function flushMove(){
    flushReq = false;
    const ix = Math.trunc(accX), iy = Math.trunc(accY);
    if (ix || iy){ accX -= ix; accY -= iy; mouse('M ' + ix + ' ' + iy); cursorAlive(); }
  }

  pad.addEventListener('pointerdown', e => {
    e.preventDefault();
    pad.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    $('hint').style.opacity = 0;
    if (pts.size === 1){
      downAt = performance.now(); moved = 0; maxPts = 1; held = false; scX = scY = 0;
      const r = pad.getBoundingClientRect();
      dot.style.left = (e.clientX - r.left)+'px'; dot.style.top = (e.clientY - r.top)+'px'; dot.style.opacity = 1;
      clearTimeout(holdT);
      holdT = setTimeout(() => {
        if (moved > TAP_MOVE || pts.size !== 1 || !cursorOn) return;
        held = true; buzz(); mouse('L'); cursorAlive();
      }, HOLD_MS);
    } else {
      maxPts = Math.max(maxPts, pts.size);
      clearTimeout(holdT);
    }
  });

  pad.addEventListener('pointermove', e => {
    const p = pts.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    if (held) return;
    if (pts.size === 1){
      const r = pad.getBoundingClientRect();
      dot.style.left = (e.clientX - r.left)+'px'; dot.style.top = (e.clientY - r.top)+'px';
      const speed = Math.hypot(dx, dy);
      const f = cfg.speed * (1 + 0.9 * Math.min(speed, 40) / 10);   // gentle acceleration
      accX += dx * f; accY += dy * f;
      if (!flushReq){ flushReq = true; requestAnimationFrame(flushMove); }
    } else if (pts.size === 2){
      // two-finger drag scrolls the page under the cursor (each finger reports, so halve)
      scX += dx * 0.5; scY += dy * 0.5;
      if (Math.abs(scX) >= SCROLL_STEP || Math.abs(scY) >= SCROLL_STEP){
        queueScroll(scX * 6, scY * 6);   // natural: content follows the fingers
        scX = scY = 0;
      }
    }
  });

  function endPointer(e){
    if (!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if (pts.size) return;
    clearTimeout(holdT);
    dot.style.opacity = 0;
    if (held) return;
    const quick = performance.now() - downAt < TAP_MS;
    if (maxPts >= 2){
      if (quick && moved < TAP_MOVE * maxPts){ key(KEY.BACK); buzz(); }
      return;
    }
    if (quick && moved < TAP_MOVE){
      buzz();
      if (!cursorOn){ mouse('V'); cursorAlive(); toast('Cursor on'); }
      else { mouse('C'); cursorAlive(); }
    }
  }
  /* ---------- scrolling (shared by the strip and two-finger drags) ---------- */
  // Each scroll becomes one swipe on the TV; they're batched so a long drag doesn't pile up.
  let pendX = 0, pendY = 0, scrollT = null, lastScroll = 0;
  const SCROLL_GAP = 300;                       // ms between swipes, roughly how long one takes on the TV
  function queueScroll(dx, dy){
    pendX += dx; pendY += dy;
    if (!scrollT) scrollT = setTimeout(flushScroll, Math.max(0, lastScroll + SCROLL_GAP - performance.now()));
  }
  function flushScroll(){
    scrollT = null;
    const cap = 700, x = Math.max(-cap, Math.min(cap, pendX)), y = Math.max(-cap, Math.min(cap, pendY));
    pendX -= x; pendY -= y;
    if (Math.abs(x) >= 4 || Math.abs(y) >= 4){
      mouse('S ' + Math.round(x) + ' ' + Math.round(y));
      lastScroll = performance.now();
      if (cursorOn) cursorAlive();
    }
    if (Math.abs(pendX) >= 4 || Math.abs(pendY) >= 4) scrollT = setTimeout(flushScroll, SCROLL_GAP);
    else pendX = pendY = 0;
  }

  // scroll strip: drag down = page goes down (like a scroll bar); tap top/bottom = one page-ish step
  const strip = $('scroll');
  let stripY = 0, stripMoved = 0, stripDown = 0;
  strip.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    strip.setPointerCapture(e.pointerId);
    stripY = e.clientY; stripMoved = 0; stripDown = performance.now();
    strip.classList.add('on'); $('hint').style.opacity = 0;
  });
  strip.addEventListener('pointermove', e => {
    if (!strip.hasPointerCapture(e.pointerId)) return;
    e.stopPropagation();
    const dy = e.clientY - stripY; stripY = e.clientY;
    stripMoved += Math.abs(dy);
    queueScroll(0, -dy * 7 * cfg.scrollSp);
  });
  function stripEnd(e){
    if (!strip.hasPointerCapture(e.pointerId)) return;
    e.stopPropagation();
    strip.classList.remove('on');
    if (stripMoved < 10 && performance.now() - stripDown < 300){
      const r = strip.getBoundingClientRect(), up = e.clientY < r.top + r.height / 2;
      queueScroll(0, (up ? 1 : -1) * 600); buzz();
    }
  }
  strip.addEventListener('pointerup', stripEnd);
  strip.addEventListener('pointercancel', stripEnd);

  pad.addEventListener('pointerup', endPointer);
  pad.addEventListener('pointercancel', endPointer);
  pad.addEventListener('contextmenu', e => e.preventDefault());

  // using the remote buttons hides the cursor so normal highlight navigation takes over
  document.querySelectorAll('[data-kc]').forEach(b => b.addEventListener('click', hideCursor));

  /* ---------- keyboard ---------- */
  const box = $('typeBox');
  let prev = '', pending = '', sendT;
  function flushText(){ if (pending){ if (bridge) bridge.text(pending); pending = ''; } }
  box.addEventListener('input', () => {
    const now = box.value;
    let i = 0; const n = Math.min(prev.length, now.length);
    while (i < n && prev[i] === now[i]) i++;
    const removed = prev.length - i;
    if (removed > 0){
      // drop not-yet-sent characters first, then delete on the TV
      const fromPending = Math.min(removed, pending.length);
      pending = pending.slice(0, pending.length - fromPending);
      for (let d = removed - fromPending; d > 0; d--) key(KEY.DEL);
    }
    pending += now.slice(i);
    prev = now;
    clearTimeout(sendT); sendT = setTimeout(flushText, 250);   // batch letters so typing is quick
  });
  box.addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); clearTimeout(sendT); flushText(); key(KEY.ENTER); }
    else if (e.key === 'Backspace' && box.value === ''){ key(KEY.DEL); }
  });
  $('clearBox').onclick = () => { clearTimeout(sendT); flushText(); box.value = ''; prev = ''; box.focus(); };

  function showKbd(show, focus){
    $('kbd').classList.toggle('show', show);
    $('kbdBtn').classList.toggle('active', show);
    if (show){ if (focus){ setDim(false); box.focus(); } }
    else { clearTimeout(sendT); flushText(); box.blur(); }
  }
  $('kbdBtn').onclick = () => {
    const show = !$('kbd').classList.contains('show');
    cfg.kbdOpen = show; save();
    showKbd(show, show);
  };
  showKbd(cfg.kbdOpen, false);          // open on start, without popping up the phone keyboard

  /* ---------- lock screen, dim mode, screen timeout ---------- */
  let dimmed = false, awake = true, swallowClick = false, idleT, sleepT;
  function setDim(on){
    if (dimmed === on) return;
    dimmed = on;
    document.body.classList.toggle('dim', on);
    if (!on) document.body.style.transform = '';
    if (has('setDim')) bridge.setDim(on, cfg.dimLevel);
  }
  // dim after the idle time; if Settings or the keyboard is open then, check again shortly
  const busy = () => $('sheet').classList.contains('show') || document.activeElement === box;
  function armDim(ms){
    clearTimeout(idleT);
    idleT = setTimeout(() => { if (busy()) armDim(5000); else setDim(true); }, ms);
  }
  function activity(){
    clearTimeout(idleT); clearTimeout(sleepT);
    if (dimmed && cfg.dimUsable) setDim(false);
    if (!awake){ awake = true; if (has('keepAwake')) bridge.keepAwake(true); }
    if (cfg.dimAfter > 0) armDim(cfg.dimAfter * 1000);
    if (cfg.awakeFor > 0) sleepT = setTimeout(() => { awake = false; if (has('keepAwake')) bridge.keepAwake(false); }, cfg.awakeFor * 60000);
  }
  document.addEventListener('pointerdown', e => {
    if (dimmed && !cfg.dimUsable){
      e.stopPropagation(); e.preventDefault();
      setDim(false);
      swallowClick = true; setTimeout(() => swallowClick = false, 600);
    }
    activity();
  }, true);
  document.addEventListener('click', e => {
    if (swallowClick){ e.stopPropagation(); e.preventDefault(); swallowClick = false; }
  }, true);
  document.addEventListener('keydown', activity, true);
  box.addEventListener('input', activity);
  document.querySelector('.status').onclick = () => { setDim(false); activity(); };
  setInterval(() => {
    if (!dimmed) return;
    const r = () => Math.round(Math.random() * 8 - 4);
    document.body.style.transform = `translate(${r()}px,${r()}px)`;
  }, 60000);

  onCfg.onLock = () => { if (has('setShowOnLock')) bridge.setShowOnLock(cfg.onLock); };
  onCfg.dimLevel = () => { if (dimmed && has('setDim')) bridge.setDim(true, cfg.dimLevel); };
  onCfg.dimAfter = onCfg.awakeFor = activity;
  onCfg.onLock();
  activity();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) activity(); });
})();
</script>
</body>
</html>
