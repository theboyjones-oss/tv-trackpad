name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          # TV cursor helper first, bundled inside the phone app
          ./gradlew :tvhelper:assembleDebug --no-daemon --stacktrace
          cp tvhelper/build/outputs/apk/debug/tvhelper-debug.apk app/src/main/assets/tvhelper.apk
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk TV-Trackpad.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TV-Trackpad
          path: TV-Trackpad.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TV Trackpad build ${{ github.run_number }}
          body: Open this page on your phone, tap TV-Trackpad.apk, then open the download to install.
          files: TV-Trackpad.apk
          make_latest: true
